[pytest]
testpaths = tests
python_files = test_*.py
python_classes = TestConnectivity TestReconnection TestLatency TestPacketLoss TestSignalThreshold TestSuite*
python_functions = test_*
addopts = -v --tb=short
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] [%(name)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
